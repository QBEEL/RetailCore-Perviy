name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  migrations:
    name: PostgreSQL migrations and server startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: retailcore_ci
          POSTGRES_PASSWORD: migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retailcore_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETAILCORE_TEST_DSN: postgresql://retailcore_ci:migration-test-password@127.0.0.1:5432/postgres
      POSTGRES_DB: retailcore_ci
      POSTGRES_USER: retailcore_ci
      POSTGRES_PASSWORD: migration-test-password
      API_SECRET: ci-test-only-secret-xxxxxxxxxxxxxxxxxxxxxxxx
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt

      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0

      - name: Check migrations and backup failures
        run: python -m pytest tests/test_server_migrations.py tests/test_server_backup.py tests/test_payment_changes_server.py -q -ra --junitxml=server-test-results.xml

      - name: Check compose and start a fresh server
        working-directory: server
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180 api
          docker compose run --rm --no-deps migrate python -m app.migrations --check
          docker compose exec -T api python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)); assert data['status']=='ok', data"

      - name: Server logs
        if: failure()
        working-directory: server
        run: docker compose logs --no-color

      - name: Stop test server
        if: always()
        working-directory: server
        run: docker compose down --volumes --remove-orphans

      - name: Upload server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server-test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt

      - name: Run tests
        run: python -m pytest tests -q -ra --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
