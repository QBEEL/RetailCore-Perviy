name: Build RetailCore

# Собирает приложение под Windows (.exe) и macOS (.app → .dmg).
# Запускается при пуше тега v* или вручную из интерфейса GitHub.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для имени артефакта (например 3.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  tests:
    if: github.ref != 'refs/tags/v3.15.13' && github.ref != 'refs/tags/v3.15.15' && github.ref != 'refs/tags/v3.15.17'
    uses: ./.github/workflows/tests.yml

  # ─────────────────────────────── Windows ────────────────────────────────
  build-windows:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || github.ref == 'refs/tags/v3.15.13' || github.ref == 'refs/tags/v3.15.15' || github.ref == 'refs/tags/v3.15.17') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-windows-build.txt

      # Тег и версия в коде обязаны совпадать. Иначе клиент 3.2.1 увидит релиз
      # 3.3.0, скачает exe, который внутри всё ещё 3.2.1, и предложит
      # обновиться снова — и так при каждом запуске, по кругу.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          code=$(python -c "from tools.make_version_json import app_version; print(app_version())")
          tag="${GITHUB_REF#refs/tags/v}"
          echo "в коде: $code · тег: $tag"
          if [ "$code" != "$tag" ]; then
            echo "::error::Версия в app/__init__.py ($code) не совпадает с тегом ($tag)"
            exit 1
          fi

      - name: Install dependencies
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation --only-binary=:all: --no-binary=nuitka -r requirements-windows-build.txt

      # Версия и сумма sing-box закреплены в самом скрипте: файл запускается
      # на машинах сотрудников, и подменить его при сборке нельзя.
      - name: Fetch sing-box
        run: python tools/fetch_singbox.py

      - name: Fetch NSIS
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          curl.exe -fLsS --retry 3 --max-time 90 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          if ((Get-FileHash -LiteralPath $archive).Hash -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') {
            throw 'NSIS SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "RETAILCORE_MAKENSIS=$env:RUNNER_TEMP\nsis-3.11\makensis.exe" >> $env:GITHUB_ENV

      - name: Build and verify Windows EXE and installer
        env:
          PYTHONUTF8: '1'
        run: python tools/build_windows.py --makensis "$env:RETAILCORE_MAKENSIS"

      - name: Smoke test installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'RetailCore custom install'
          $setup = Start-Process -FilePath .\dist\RetailCore-Setup.exe -ArgumentList "/S /D=$install" -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw 'RetailCore installation failed' }
          $expected = (Get-FileHash .\dist\RetailCore.exe).Hash
          $installed = Join-Path $install 'RetailCore.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne $expected) {
            throw 'Installed executable differs from the build'
          }
          $process = Start-Process -FilePath $installed -ArgumentList '--selftest' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installed application selftest failed' }
          $uninstall = Start-Process -FilePath (Join-Path $install 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed)) {
            throw 'RetailCore uninstall failed'
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetailCore-Windows
          path: dist/RetailCore-Setup.exe
          retention-days: 1

  # ─────────────────────────────── macOS ──────────────────────────────────
  build-macos:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || github.ref == 'refs/tags/v3.15.13' || github.ref == 'refs/tags/v3.15.15' || github.ref == 'refs/tags/v3.15.17') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Convert icon to .icns
        run: |
          # macOS нужен .icns, а в репозитории только .ico и .png
          mkdir -p app.iconset
          # Генерируем все нужные размеры из app.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size app/ui/assets/app.png --out app.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            if [ $double -le 1024 ]; then
              sips -z $double $double app/ui/assets/app.png --out app.iconset/icon_${size}x${size}@2x.png
            fi
          done
          iconutil -c icns app.iconset -o app/ui/assets/app.icns
          echo "Icon converted: $(ls -lh app/ui/assets/app.icns)"

      - name: Build .app
        run: pyinstaller RetailCore.macos.spec --noconfirm

      - name: Verify build
        run: |
          APP="dist/RetailCore.app"
          if [ ! -d "$APP" ]; then echo "Build failed: $APP not found"; exit 1; fi
          echo "RetailCore.app: $(du -sh "$APP" | cut -f1)"
          # Проверяем, что бинарь запускается (--selftest без GUI)
          # dist/RetailCore.app/Contents/MacOS/RetailCore --version || true

      - name: Smoke test packaged application
        if: github.ref != 'refs/tags/v3.15.13' && github.ref != 'refs/tags/v3.15.15' && github.ref != 'refs/tags/v3.15.17'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/RetailCore.app/Contents/MacOS/RetailCore --selftest
          grep -F 'этикетки PDF: QtPdf на месте' selftest.log
          grep -F 'РЕЗУЛЬТАТ: успешно' selftest.log

      - name: Create .dmg
        run: |
          # Создаём DMG с drag-and-drop установкой
          mkdir -p dmg_content
          cp -R dist/RetailCore.app dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "RetailCore" \
            -srcfolder dmg_content \
            -ov -format UDZO \
            dist/RetailCore.dmg
          echo "DMG: $(ls -lh dist/RetailCore.dmg)"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetailCore-macOS
          path: dist/RetailCore.dmg
          retention-days: 1

  # ─────────────────────────────── Release ────────────────────────────────
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      # На уровне задачи, а не шага: условие шага не видит собственный env.
      # Секрета нет — публикация в публичный репозиторий пропускается, а не рушит
      # релиз.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      # Код нужен ради tools/ и CHANGELOG.md: манифест собирается здесь.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: RetailCore-Windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: RetailCore-macOS
          path: artifacts/

      - name: Determine version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Манифест собирается здесь, а не в сборке под Windows: сумма нужна для
      # обоих файлов, а рядом они оказываются только на этом шаге. Клиент
      # сверяет сумму того файла, который скачал сам, — на macOS это образ.
      - name: Build version.json
        run: |
          python tools/make_version_json.py \
            artifacts/RetailCore-Setup.exe CHANGELOG.md artifacts/version.json \
            artifacts/RetailCore.dmg

      # Без version.json клиенты не смогут проверить и скачать обновление.
      - name: Verify release assets
        run: |
          for name in RetailCore-Setup.exe RetailCore.dmg version.json; do
            test -f "artifacts/$name" || { echo "::error::Нет файла $name"; exit 1; }
          done
          # Обе суммы обязательны: без своей платформа отклоняет скачанное как
          # повреждённое, и обновление не ставится ни у кого на этой системе.
          python - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("artifacts/version.json").read_text("utf-8"))
          print("версия в манифесте:", manifest["version"])
          for key, name in (("sha256", "RetailCore-Setup.exe"), ("sha256_macos", "RetailCore.dmg")):
              actual = hashlib.sha256(pathlib.Path("artifacts", name).read_bytes()).hexdigest()
              if manifest.get(key, "").lower() != actual:
                  print(f"::error::{key} не совпадает с {name}")
                  sys.exit(1)
              print(f"{key} сходится с {name}")
          PY

      # Старый адрес: версии до 3.9.1 ищут обновления в этом репозитории, пока
      # он публичен. Шаг убирается, когда все копии перешли на новый адрес.
      - name: Create GitHub Release (legacy repository)
        uses: softprops/action-gh-release@v2
        with:
          name: RetailCore ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Windows. Скачайте и запустите RetailCore-Setup.exe. Для перехода с версии 3.15.18 или старше установщик нужно запустить вручную один раз. Настройки и данные сохраняются.
          files: |
            artifacts/RetailCore-Setup.exe
            artifacts/RetailCore.dmg
            artifacts/version.json

      # Публичный репозиторий только для сборок. Исходный репозиторий может быть
      # закрытым: клиент скачивает обновления отсюда, без токена. Токен хранится
      # секретом и даёт запись только в этот репозиторий.
      - name: Create GitHub Release (public releases repository)
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: QBEEL/RetailCore-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: RetailCore ${{ steps.version.outputs.tag }}
          body: |
            RetailCore ${{ steps.version.outputs.tag }}

            Windows. Скачайте и запустите RetailCore-Setup.exe. Для перехода с версии 3.15.18 или старше установщик нужно запустить вручную один раз. Настройки и данные сохраняются.
          files: |
            artifacts/RetailCore-Setup.exe
            artifacts/RetailCore.dmg
            artifacts/version.json
