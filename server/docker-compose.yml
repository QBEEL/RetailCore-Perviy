# Серверная часть RetailCore.
#
# Наружу смотрит только Caddy; база и API доступны лишь внутри сети compose.
#
# Сервис migrate применяет базовую схему и миграции до запуска API.

x-api-build: &api-build
  context: .
  dockerfile: api/Dockerfile

services:
  db:
    image: postgres:16-alpine
    container_name: retailcore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Сортировка по-русски: без неё список получателей уедет в порядок ASCII,
      # где «Ёлка» окажется после «Яблоко».
      LANG: ru_RU.utf8
    volumes:
      - retailcore-db:/var/lib/postgresql/data
    # Порт наружу оставлен на localhost: он нужен для ручного psql и снятия
    # копий, но не для приложения — оно ходит через API.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Ограничения не дают контейнерам выесть память.
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build: *api-build
    image: retailcore-api
    restart: "no"
    command: ["python", "-m", "app.migrations"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    image: retailcore-api
    container_name: retailcore-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_SECRET: ${API_SECRET:?Задайте API_SECRET в .env}
      API_TOKEN_HOURS: ${API_TOKEN_HOURS:-12}
      API_SESSION_DAYS: ${API_SESSION_DAYS:-7}
      API_FILES_DIR: /srv/files
      # ИИ-правка заметок. Без ключа остальной сервер работает как обычно.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      AI_HTTPS_PROXY: ${AI_HTTPS_PROXY:-}
    volumes:
      # Та же папка, что копирует backup.sh: вложения переживают пересборку
      # образа и попадают в резервную копию.
      - ./files:/srv/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    image: caddy:2-alpine
    container_name: retailcore-caddy
    restart: unless-stopped
    # Единственный контейнер, смотрящий наружу. Сертификат для retail.qbeely.ru
    # Caddy получает и продлевает сам, для этого ему нужны 80 и 443.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  retailcore-db:
  caddy-data:
  caddy-config:
